name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: go.sum

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
        cache-dependency-path: go.sum

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
        cache-dependency-path: go.sum

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run Gosec Security Scanner
      run: gosec -no-fail ./...
      continue-on-error: true

  mod-tidy:
    name: Go Mod Tidy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
        cache-dependency-path: go.sum

    - name: Check go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

  # Real sockets, loopback only: GitHub-hosted runners block outbound ICMP,
  # so every target is 127.0.0.1 / ::1 or a server started by the tests.
  integration:
    name: Integration / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true
        cache-dependency-path: go.sum

    - name: Show loopback and ICMP settings
      run: |
        ip addr show lo
        sysctl net.ipv4.ping_group_range

    # Datagram ICMP fallback of the tracer (no privileges). Strict only when
    # the kernel allows unprivileged ICMP for this user's group.
    - name: Integration tests (unprivileged ICMP)
      env:
        MPING_IT_TARGETS: 127.0.0.1,::1
        MPING_IT_ROUNDS: '10'
        MPING_IT_INTERVAL: 200ms
        MPING_IT_HOSTS: 127.0.0.3,127.0.0.1,127.0.0.2
        MPING_IT_DURATION: 8s
      run: |
        read -r lo hi < /proc/sys/net/ipv4/ping_group_range
        gid=$(id -g)
        if [ "$gid" -ge "$lo" ] && [ "$gid" -le "$hi" ]; then
          export MPING_IT_STRICT=1
        else
          echo "::notice::unprivileged ICMP is disabled (ping_group_range=$lo $hi); unprivileged trace tests may skip"
        fi
        go test -tags integration -count=1 -v -run Integration ./internal/trace/ ./internal/ui/tui/

    # Raw socket path: compile the test binary and grant it cap_net_raw
    # instead of running go test as root.
    - name: Integration tests (raw ICMP via cap_net_raw)
      env:
        MPING_IT_TARGETS: 127.0.0.1,::1
        MPING_IT_ROUNDS: '10'
        MPING_IT_INTERVAL: 200ms
        MPING_IT_STRICT: '1'
        MPING_IT_PRIVILEGED: '1'
      run: |
        go test -c -tags integration -o "$RUNNER_TEMP/trace.test" ./internal/trace/
        sudo setcap cap_net_raw=+ep "$RUNNER_TEMP/trace.test"
        cd internal/trace && "$RUNNER_TEMP/trace.test" -test.count=1 -test.v -test.run Integration

    - name: Build mping with cap_net_raw
      run: |
        go build -o "$RUNNER_TEMP/mping" ./cmd/mping
        sudo setcap cap_net_raw=+ep "$RUNNER_TEMP/mping"
        getcap "$RUNNER_TEMP/mping"

    - name: End-to-end tests (mping batch against local servers)
      env:
        MPING_BIN: ${{ runner.temp }}/mping
        MPING_E2E_ICMP: require
        MPING_E2E_IPV6: require
      run: go test -tags e2e -count=1 -v ./test/e2e/
